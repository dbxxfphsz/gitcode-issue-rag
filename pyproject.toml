[project]
name = "gitcode-issue-skill"
version = "0.3.0"
description = "Issue 相似性分析 Skill - 知识库管理、相似问题检索、报告生成、GitCode 评论与 FAQ 生成"
requires-python = ">=3.10"

dependencies = [
    # HTTP 客户端
    "httpx>=0.28",

    # 数值计算（embedding 余弦相似度）
    "numpy>=1.26",

    # 配置管理
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "python-dotenv>=1.0",

    # 日志
    "loguru>=0.7",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["issue_kb*"]

[tool.ruff]
target-version = "py310"
line-length = 100
